<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Visão lógica da Fundação de IA Multiprojetos</title>
  <desc id="descricao">Uma pessoa define objetivos, escopo e aprovações. A skill orienta o host executor pelos fluxos A, implantar; B, adaptar; e C, operar, com referências, scripts e modelos. A fundação compartilha contratos, identidade e ACL, execução e retomada, observabilidade e recuperação. Os projetos fictícios juridico-lab, reversa-lab e atendimento-lab preservam seus documentos, regras e escopos de memória, cache, casos e conhecimento GOLD. No kit, parte do estado fica em SQLite compartilhado, com autorização por escopo. Integrações externas são opcionais e dependem do host.</desc>
  <defs>
    <marker id="seta" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="#597889"/>
    </marker>
    <marker id="seta-opcional" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="#7F9DA7"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; }
      .secao { font-size: 12px; font-weight: 700; letter-spacing: 1.25px; fill: #536B7A; }
      .titulo-card { font-size: 18px; font-weight: 700; fill: #112D43; }
      .texto { font-size: 16px; fill: #334E60; }
      .apoio { font-size: 14px; fill: #5C7382; }
      .conector { fill: none; stroke: #597889; stroke-width: 2; }
      .projeto { font-size: 20px; font-weight: 700; fill: #0C626B; }
      .etiqueta { font-size: 13px; font-weight: 700; fill: #235F68; }
    </style>
  </defs>

